services:
    traefik:
        image: traefik:v3.6
        command:
            - --providers.swarm=true
            - --providers.swarm.network=traefik-public
            - --providers.swarm.exposedByDefault=false
            - --entrypoints.web.address=:80
            - --entrypoints.websecure.address=:443
            - --certificatesresolvers.letsencrypt.acme.email=nathan.pham1505@gmail.com
            - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
            - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
        ports:
            - target: 80
              published: 80
              mode: host
            - target: 443
              published: 443
              mode: host
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - traefik_letsencrypt:/letsencrypt
        networks:
            - traefik-public
        deploy:
            placement:
                constraints:
                    - node.role == manager
    api:
        image: asia-southeast1-docker.pkg.dev/voltarocks-42-sandbox/todo-repo/todo-app:latest
        environment:
            POSTGRES_HOST: db
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            NODE_ENV: production
        networks:
            - todo-internal
            - traefik-public
        deploy:
            update_config:
                order: start-first
            labels:
                - 'traefik.enable=true'
                - 'traefik.http.routers.api.rule=Host(`ngocpmt-todo-app.duckdns.org`)'
                - 'traefik.http.routers.api.entrypoints=websecure'
                - 'traefik.http.routers.api.tls.certresolver=letsencrypt'
                - 'traefik.http.services.api.loadbalancer.server.port=3000'
    db:
        image: asia-southeast1-docker.pkg.dev/voltarocks-42-sandbox/todo-repo/postgres-walg:latest
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}

            WALG_GS_PREFIX: gs://${BACKUP_BUCKET}
            WALG_COMPRESSION_METHOD: brotli
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - todo-internal
        command: >
            postgres
            -c wal_level=replica
            -c archive_mode=on
            -c archive_command='wal-g wal-push %p'
            -c restore_command='wal-g wal-fetch %f %p'

    backup:
        image: asia-southeast1-docker.pkg.dev/voltarocks-42-sandbox/todo-repo/postgres-walg:latest
        environment:
            WALG_GS_PREFIX: gs://${BACKUP_BUCKET}
            WALG_COMPRESSION_METHOD: brotli
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - todo-internal
        deploy:
            replicas: 1
            placement:
                constraints:
                    - node.role == manager
        command: >
            sh -c "
                while true; do
                    echo 'Starting base backup';
                    wal-g backup-push /var/lib/postgresql/data;
                    wal-g delete retain 7 --confirm;
                    echo 'Sleeping 24h';
                    sleep 86400;
                done
            "

    prometheus:
        image: prom/prometheus:latest
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
            - prom_data:/prometheus
        networks:
            - todo-internal

    grafana:
        image: grafana/grafana:latest
        ports:
            - '127.0.0.1:3001:3000'
        environment:
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
        volumes:
            - grafana_data:/var/lib/grafana
        networks:
            - todo-internal
        depends_on:
            - prometheus

volumes:
    pgdata:
    prom_data:
    grafana_data:
    traefik_letsencrypt:

networks:
    todo-internal:
        driver: overlay
    traefik-public:
        external: true
